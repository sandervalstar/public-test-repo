name: Dadoku tests and immutable image
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: dadoku-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Run reviewed tests
      run: python3 -m unittest -v
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
    - test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Set up isolated Buildx builder
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      with:
        driver: docker-container
    - name: Authenticate to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REGISTRY_USER: ${{ github.actor }}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
    - name: Build and publish exact commit
      env:
        REPOSITORY: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        SOURCE_REF: ${{ github.ref }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        IMAGE="ghcr.io/$REPOSITORY"
        IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
        docker buildx build --platform linux/amd64 --file Dockerfile \
          --label "org.opencontainers.image.revision=$COMMIT" \
          --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
          --tag "$IMAGE:$COMMIT" --tag "$IMAGE:$COMMIT-$RUN_ID-$RUN_ATTEMPT" \
          --provenance=mode=min --metadata-file "$RUNNER_TEMP/dadoku-build.json" --push .
        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dadoku-build.json").read_text())
        digest = metadata.get("containerimage.digest")
        if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
            raise SystemExit("BuildKit did not return a valid immutable image digest.")
        repository = os.environ["REPOSITORY"]
        image = f"ghcr.io/{repository.lower()}@{digest}"
        evidence = {
            "version": 1,
            "repository": repository,
            "commit_sha": os.environ["COMMIT"],
            "ref": os.environ["SOURCE_REF"],
            "workflow_ref": os.environ["WORKFLOW_REF"],
            "run_id": int(os.environ["RUN_ID"]),
            "run_attempt": int(os.environ["RUN_ATTEMPT"]),
            "image": image,
            "platform": "linux/amd64",
            "verification": "workflow_output_not_independently_verified",
        }
        (Path(os.environ["RUNNER_TEMP"]) / "dadoku-image.json").write_text(
            json.dumps(evidence, sort_keys=True) + "\n"
        )
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write(f"Published `{image}` for commit `{os.environ['COMMIT']}`.\n")
            summary.write("Evidence is not an independently verified attestation.\n")
        PY
    - name: Read exact published subject
      id: image
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path
        claim = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dadoku-image.json").read_text())
        name, digest = claim["image"].split("@", 1)
        if name != "ghcr.io/sandervalstar/public-test-repo" or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
            raise SystemExit("Invalid image subject.")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"name={name}\ndigest={digest}\n")
        PY
    - name: Attest the exact published image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
    - name: Save image identity evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dadoku-image-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/dadoku-image.json
        if-no-files-found: error
        retention-days: 30
